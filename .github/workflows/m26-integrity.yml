name: TheMITbro M26 Integrity

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m26-integrity:
    name: Reproducible Build + Artifact Integrity
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6

      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install pytest pytest-cov

      # ============================================================
      # 4. SOURCE VALIDATION
      # ============================================================

      - name: Validate Python source
        run: |
          set -e

          python -m compileall -q src scripts

          echo "Python source compilation: PASSED"

      # ============================================================
      # 5. M26 INTEGRITY TESTS
      # ============================================================

      - name: Run M26 integrity tests
        env:
          PYTHONPATH: .
        run: |
          set -e

          python -m pytest -q \
            tests/test_milestone26_integrity.py

      # ============================================================
      # 6. M26 CORE COVERAGE
      # ============================================================

      - name: Verify M26 core coverage
        env:
          PYTHONPATH: .
        run: |
          set -e

          python -m pytest -q \
            --cov=src.question_compiler \
            --cov=src.public_api \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            tests/test_milestone26_integrity.py \
            tests/test_milestone25_release.py

      # ============================================================
      # 7. M25 REGRESSION
      # ============================================================

      - name: Run M25 release regression
        env:
          PYTHONPATH: .
        run: |
          set -e

          python -m pytest -q \
            tests/test_milestone25_release.py

      # ============================================================
      # 8. M26 AUDIT
      # ============================================================

      - name: Run M26 integrity audit
        env:
          PYTHONPATH: .
        run: |
          set -e

          python scripts/m26_integrity_audit.py

      # ============================================================
      # 9. RELEASE CLEANLINESS
      # ============================================================

      - name: Verify release cleanliness
        run: |
          set -e

          if git ls-files | grep -E '(^|/)(__pycache__|.*\.py[cod]$)' ; then
            echo "ERROR: Python cache/bytecode files are tracked in Git."
            exit 1
          fi

          if git ls-files | grep -E '(^|/)(\.coverage$|coverage/)' ; then
            echo "ERROR: Coverage output is tracked in Git."
            exit 1
          fi

          if git ls-files | grep -E '(^|/)\.pytest_cache(/|$)' ; then
            echo "ERROR: .pytest_cache is tracked in Git."
            exit 1
          fi

          echo "Release cleanliness: PASSED"

      # ============================================================
      # 10. FINAL ACCEPTANCE
      # ============================================================

      - name: M26 acceptance
        run: |
          echo "=============================================="
          echo "TheMITbro Milestone 26"
          echo "Reproducible Build + Artifact Integrity"
          echo "=============================================="
          echo "Source compilation: PASSED"
          echo "M26 integrity tests: PASSED"
          echo "M25 regression: PASSED"
          echo "M26 integrity audit: PASSED"
          echo "Release cleanliness: PASSED"
          echo "=============================================="
          echo "MILESTONE 26 ACCEPTANCE PASSED"
          echo "=============================================="
