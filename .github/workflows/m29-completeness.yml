name: TheMITbro M29 Completeness

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m29-completeness:
    name: Formatter Completeness + Edge-Case Closure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest pytest-cov

      - name: Verify M29 required files
        run: |
          set -e
          echo "=== M29 required files ==="
          test -f docs/milestones/M29/ACCEPTANCE.md
          test -f docs/milestones/M29/RELEASE_NOTES.md
          test -f tests/test_milestone29_completeness.py
          test -f scripts/m29_completeness_audit.py
          test -f .github/workflows/m29-completeness.yml
          test -f input/milestone28_real_world_corpus.json
          echo "M29 required files: PASSED"

      - name: Validate Python source
        run: |
          set -e
          python -m compileall -q src scripts
          echo "Python source compilation: PASSED"

      - name: Run M29 completeness tests
        env:
          PYTHONPATH: .
        run: |
          set -e
          python -m pytest -q tests/test_milestone29_completeness.py

      - name: Run M28 regression
        env:
          PYTHONPATH: .
        run: |
          set -e
          python -m pytest -q tests/test_milestone28_corpus.py

      - name: Run M29 independent audit
        env:
          PYTHONPATH: .
        run: |
          set -e
          python scripts/m29_completeness_audit.py

      - name: Check release cleanliness
        run: |
          set -e
          if git ls-files | grep -E '(^|/)(__pycache__|.*\.py[cod]$)' ; then
            echo "ERROR: Python cache/bytecode files are tracked in Git."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(\.coverage$|coverage/)' ; then
            echo "ERROR: Coverage output is tracked in Git."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.pytest_cache(/|$)' ; then
            echo "ERROR: .pytest_cache is tracked in Git."
            exit 1
          fi
          echo "Release cleanliness: PASSED"

      - name: Upload M29 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m29-completeness-evidence
          path: |
            docs/milestones/M29/ACCEPTANCE.md
            docs/milestones/M29/RELEASE_NOTES.md
            tests/test_milestone29_completeness.py
            scripts/m29_completeness_audit.py
            input/milestone28_real_world_corpus.json
          if-no-files-found: warn

      - name: M29 acceptance
        run: |
          echo "=============================================="
          echo "TheMITbro Milestone 29"
          echo "Formatter Completeness + Edge-Case Closure"
          echo "=============================================="
          echo "Required files: PASSED"
          echo "Source compilation: PASSED"
          echo "M29 completeness tests: PASSED"
          echo "M28 regression: PASSED"
          echo "M29 independent audit: PASSED"
          echo "Release cleanliness: PASSED"
          echo "M29 evidence: UPLOADED"
          echo "=============================================="
          echo "MILESTONE 29 CI VALIDATION PASSED"
          echo "=============================================="
